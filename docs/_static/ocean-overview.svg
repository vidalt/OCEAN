<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="390" viewBox="0 0 1100 390" role="img" aria-labelledby="title desc">
  <title id="title">One question. Three solvers.</title>
  <desc id="desc">OCEAN turns a query and a tree ensemble into a counterfactual explanation using mixed-integer programming, constraint programming, or weighted MaxSAT.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1"><stop stop-color="#081827"/><stop offset="1" stop-color="#102e43"/></linearGradient>
    <linearGradient id="accent"><stop stop-color="#5eead4"/><stop offset="1" stop-color="#7dd3fc"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#14b8a6" stop-opacity=".16"/><stop offset="1" stop-color="#14b8a6" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#93c5fd" opacity=".09"/></pattern>
  </defs>
  <rect width="1100" height="390" rx="24" fill="url(#background)"/>
  <rect width="1100" height="390" rx="24" fill="url(#grid)"/>
  <ellipse cx="860" cy="160" rx="280" ry="210" fill="url(#glow)"/>
  <path d="M0 330 Q150 280 310 330 T640 330 T1100 310 V366 Q1100 390 1076 390 H24 Q0 390 0 366Z" fill="#2dd4bf" opacity=".04"/>
  <path d="M0 349 Q190 295 365 344 T730 337 T1100 325" fill="none" stroke="#5eead4" stroke-opacity=".12"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="44" y="43" fill="#5eead4" font-size="12" font-weight="700" letter-spacing="3">OCEAN / COUNTERFACTUAL EXPLANATIONS</text>
    <text x="44" y="87" fill="#f0f9ff" font-size="34" font-weight="700">One question. Three solvers.</text>
    <text x="44" y="117" fill="#a7c4d6" font-size="16">What is the smallest change that changes the prediction?</text>
    <g fill="none" stroke-width="1.5">
      <path d="M270 222 C334 222 326 171 397 171" stroke="#5eead4" opacity=".65"/>
      <path d="M270 222 H397" stroke="#7dd3fc" opacity=".65"/>
      <path d="M270 222 C334 222 326 273 397 273" stroke="#c4b5fd" opacity=".65"/>
      <path d="M703 171 C768 171 764 222 830 222" stroke="#5eead4" opacity=".65"/>
      <path d="M703 222 H830" stroke="#7dd3fc" opacity=".65"/>
      <path d="M703 273 C768 273 764 222 830 222" stroke="#c4b5fd" opacity=".65"/>
    </g>
    <rect x="44" y="151" width="226" height="142" rx="16" fill="#0c2032" stroke="#305065"/>
    <text x="64" y="179" fill="#94b7cb" font-size="11" letter-spacing="2">START WITH</text>
    <text x="64" y="211" fill="#f0f9ff" font-size="23" font-weight="700">Your query</text>
    <text x="64" y="238" fill="#a7c4d6" font-size="14">+ a trained tree ensemble</text>
    <path d="M66 265 H86 M86 265 L98 256 M86 265 L98 274" fill="none" stroke="#5eead4" stroke-width="2"/>
    <circle cx="66" cy="265" r="3" fill="#5eead4"/><circle cx="100" cy="255" r="3" fill="#7dd3fc"/><circle cx="100" cy="275" r="3" fill="#7dd3fc"/>
    <text x="116" y="270" fill="#7facc4" font-size="12">A prediction to explain</text>
    <g>
      <rect x="397" y="149" width="306" height="44" rx="11" fill="#102d39" stroke="#5eead4" stroke-opacity=".45"/>
      <circle cx="420" cy="171" r="4" fill="#5eead4"/>
      <text x="437" y="177" fill="#5eead4" font-size="17" font-weight="700">MIP</text>
      <text x="493" y="176" fill="#d6e8ef" font-size="13">Mixed-integer programming</text>
      <rect x="397" y="200" width="306" height="44" rx="11" fill="#112b41" stroke="#7dd3fc" stroke-opacity=".45"/>
      <circle cx="420" cy="222" r="4" fill="#7dd3fc"/>
      <text x="437" y="228" fill="#7dd3fc" font-size="17" font-weight="700">CP</text>
      <text x="493" y="227" fill="#d6e8ef" font-size="13">Constraint programming</text>
      <rect x="397" y="251" width="306" height="44" rx="11" fill="#202942" stroke="#c4b5fd" stroke-opacity=".45"/>
      <circle cx="420" cy="273" r="4" fill="#c4b5fd"/>
      <text x="437" y="279" fill="#c4b5fd" font-size="17" font-weight="700">MaxSAT</text>
      <text x="519" y="278" fill="#d6e8ef" font-size="13">Weighted satisfiability</text>
    </g>
    <rect x="830" y="151" width="226" height="142" rx="16" fill="#10313c" stroke="#5eead4" stroke-opacity=".6"/>
    <text x="850" y="179" fill="#5eead4" font-size="11" letter-spacing="2">EXPLORE</text>
    <text x="850" y="211" fill="#f0f9ff" font-size="23" font-weight="700">An alternative</text>
    <text x="850" y="238" fill="#b4d5df" font-size="14">A counterfactual explanation</text>
    <path d="M851 264 l5 5 10 -11" fill="none" stroke="#5eead4" stroke-width="2" stroke-linecap="round"/>
    <text x="877" y="270" fill="#b4d5df" font-size="12">Target class · Minimal distance</text>
    <rect x="44" y="334" width="122" height="27" rx="13.5" fill="#183348"/><text x="105" y="352" text-anchor="middle" fill="#b7d4e4" font-size="12">Random forest</text>
    <rect x="176" y="334" width="94" height="27" rx="13.5" fill="#183348"/><text x="223" y="352" text-anchor="middle" fill="#b7d4e4" font-size="12">AdaBoost</text>
    <rect x="280" y="334" width="94" height="27" rx="13.5" fill="#183348"/><text x="327" y="352" text-anchor="middle" fill="#b7d4e4" font-size="12">XGBoost</text>
    <text x="1056" y="352" text-anchor="end" fill="#7199b0" font-size="12" letter-spacing="1">UNDERSTAND THE PREDICTION. EXPLORE THE ALTERNATIVES.</text>
  </g>
</svg>
